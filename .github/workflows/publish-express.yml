name: Publish exercise 3.1 image
on:
  push:
    branches: [main]
    paths: ['3_1/**', '.github/workflows/publish-express.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: jhlow0106
          password: ${{ secrets.DOCKER_HUB }}
      - uses: docker/build-push-action@v7
        with:
          context: ./3_1
          push: true
          tags: jhlow0106/express-pipeline:latest
