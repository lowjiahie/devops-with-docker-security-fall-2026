<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#334e68"/></marker><style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:31px;font-weight:bold}.h{font-size:21px;font-weight:bold}.t{font-size:17px}.small{font-size:15px}.border{stroke:#829ab1;stroke-width:2}.line{stroke:#334e68;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}</style></defs>
<rect width="1400" height="950" fill="#f3f7fb"/><text x="55" y="56" class="title">Kubernetes cluster: blog and game applications</text><text x="55" y="86" class="t">Example deployment on three host machines</text>
<rect x="38" y="115" width="250" height="110" rx="14" fill="#ffffff" class="border"/><text x="58" y="149" class="h">My computer</text><text x="58" y="181" class="t">kubectl apply -f apps.yaml</text>
<rect x="38" y="295" width="250" height="105" rx="14" fill="#ffffff" class="border"/><text x="58" y="328" class="h">Internet client</text><text x="58" y="360" class="t">HTTP GET /</text>
<rect x="327" y="115" width="1035" height="765" rx="22" fill="#ffffff" stroke="#486581" stroke-width="3"/><text x="354" y="153" class="h">Cluster</text>
<rect x="355" y="178" width="310" height="183" rx="12" fill="#e6f0ff" stroke="#8bb4ef" stroke-width="2"/><text x="372" y="211" class="h">Host 1 · control plane</text><rect x="374" y="230" width="270" height="50" rx="8" fill="#fff" class="border"/><text x="392" y="261" class="t">Kubernetes API server</text><text x="374" y="312" class="small">Scheduler + controller manager</text><text x="374" y="338" class="small">Schedule and reconcile workloads</text>
<rect x="703" y="178" width="293" height="183" rx="12" fill="#fff6df" stroke="#d8ad50" stroke-width="2"/><text x="721" y="212" class="h">Ingress / gateway</text><text x="721" y="245" class="t">Routes HTTP requests to</text><text x="721" y="270" class="t">the matching Service</text><text x="721" y="317" class="small">Internet traffic entry point</text>
<rect x="1034" y="178" width="290" height="183" rx="12" fill="#ecf9f1" stroke="#70bd8f" stroke-width="2"/><text x="1053" y="212" class="h">Services</text><text x="1053" y="249" class="t">blog-service → blog Pods</text><text x="1053" y="283" class="t">game-service → game Pod</text><text x="1053" y="324" class="small">Stable cluster endpoints</text>
<rect x="355" y="435" width="460" height="370" rx="12" fill="#f5f8fd" class="border"/><text x="378" y="470" class="h">Host 2 · worker node</text><text x="378" y="495" class="small">kubelet + container runtime</text>
<rect x="378" y="520" width="405" height="105" rx="10" fill="#dceeff" stroke="#6ca6db" stroke-width="2"/><text x="396" y="551" class="h">Pod · blog replica A</text><rect x="398" y="565" width="355" height="42" rx="7" fill="#fff" class="border"/><text x="413" y="592" class="t">Container · blog web server</text>
<rect x="378" y="651" width="405" height="105" rx="10" fill="#e8f8e8" stroke="#81b884" stroke-width="2"/><text x="396" y="682" class="h">Pod · game server</text><rect x="398" y="696" width="355" height="42" rx="7" fill="#fff" class="border"/><text x="413" y="723" class="t">Container · game application</text>
<rect x="853" y="435" width="471" height="370" rx="12" fill="#f5f8fd" class="border"/><text x="875" y="470" class="h">Host 3 · worker node</text><text x="875" y="495" class="small">kubelet + container runtime</text>
<rect x="877" y="520" width="420" height="105" rx="10" fill="#dceeff" stroke="#6ca6db" stroke-width="2"/><text x="895" y="551" class="h">Pod · blog replica B</text><rect x="897" y="565" width="370" height="42" rx="7" fill="#fff" class="border"/><text x="912" y="592" class="t">Container · blog web server</text>
<rect x="877" y="650" width="420" height="106" rx="10" fill="#fff3df" stroke="#d4ac67" stroke-width="2"/><text x="895" y="683" class="h">Volume · persistent storage</text><text x="895" y="714" class="t">Mounted by blog replica B</text>
<path d="M288 170 H342 V255 H374" class="line"/><text x="292" y="145" class="small">deploy</text><path d="M288 347 H310 V385 H848 V362" class="line"/><path d="M996 270 H1034" class="line"/><path d="M1157 361 V405 H595 V520" class="line"/><path d="M1200 361 V402 H1085 V520" class="line"/><path d="M1230 361 V390 H801 V702 H783" class="line"/><path d="M1086 650 V625" class="line dash"/>
<text x="355" y="851" class="small">Solid arrows: requests / deployment. Dashed arrow: volume mount. Services route traffic to selected Pods.</text><text x="55" y="917" class="small">Conceptual diagram · control plane, Services and storage simplified for clarity</text>
</svg>
